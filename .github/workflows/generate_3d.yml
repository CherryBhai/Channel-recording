name: Generate 3D City Model (OSM2World)
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Bounding Box'
        required: true
        default: '78.5340,17.3750,78.5440,17.3850'
      filename:
        description: 'Output filename'
        required: true
        default: 'hyderabad_model'
jobs:
  build_3d_model:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download OSM2World
        run: |
          wget -q https://osm2world.org/download/files/latest/OSM2World-latest-bin.zip -O osm2world.zip
          unzip -q -o osm2world.zip -d OSM2World_Tool
          JAR_PATH=$(find OSM2World_Tool -name "OSM2World.jar" | head -n 1)
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV
      - name: Fetch Map Data
        run: |
          HTTP_STATUS=$(curl -s -o map_data.osm -w "%{http_code}" "https://api.openstreetmap.org/api/0.6/map?bbox=${BBOX}")
          if [ "$HTTP_STATUS" -ne 200 ]; then exit 1; fi
        env:
          BBOX: ${{ github.event.inputs.bbox }}
      - name: Generate 3D .obj File
        run: java -Djava.awt.headless=true -Xmx5G -jar ${{ env.JAR_PATH }} -i map_data.osm -o ${{ github.event.inputs.filename }}.obj
      - name: Upload 3D Model
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.filename }}-3D-Model
          path: ${{ github.event.inputs.filename }}.obj
